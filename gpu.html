const ansi=/\x1b\[[0-9;]*m/g;
const plain=s=>s.replace(ansi,'');

const fleet=[],nodes=[],monitor={};
let running=null,pending=null;
for(const line of snapshot.split(/\r?\n/)){
  const clean=plain(line);
  const f=clean.match(/^\|\|\s*(V100|A100|H100|H200)\s+(\d+)\s+(\d+)\s+(\d+)\s+(\d+)\s*%\s*\|\|/);
  if(f)fleet.push({type:f[1],total:+f[2],used:+f[3],idle:+f[4],load:+f[5]});
  const m=clean.match(/(Total jobs processed|Skipped jobs|Warnings sent|Terminated \(killed\))\s*:\s*(\d+)/);
  if(m)monitor[m[1]]=+m[2];
  const q=clean.match(/^Running:\s*(\d+)\s+Pending:\s*(\d+)/);
  if(q){running=+q[1];pending=+q[2]}
  const n=line.match(/^(\S+)\s+(V100|A100|H100|H200)\s+(\S+)\s+(\d+)\s+(\d+)\/(\d+)\s+\|(.*)\|([^|]*)$/);
  if(n){
    const slots=[...n[7].matchAll(/\x1b\[(102|103)m[^\x1b]*\x1b\[0m/g)].map(x=>x[1]==='102'?'used':'idle');
    nodes.push({name:n[1],type:n[2],state:n[3],jobs:+n[4],allocated:+n[5],capacity:+n[6],slots,users:n[8].split(',').map(s=>s.trim()).filter(Boolean)});
  }

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

document.querySelector('#summary').innerHTML=metrics.map(([label,value])=>`<div class="card"><div class="metric-label">${label}</div><div class="metric">${value??'—'}</div></div>`).join('');
const loadColor=load=>`hsl(${Math.round(145-1.45*Math.max(0,Math.min(100,load)))} 75% 45%)`;
document.querySelector('#fleet').innerHTML=fleet.map(f=>`<div class="fleet-card"><div class="donut" style="--pct:${Math.min(100,f.load)};--fill:${loadColor(f.load)}"><b>${f.load}%</b></div><div><h3>${f.type}</h3><p>${f.used} used · ${f.idle} idle</p><p>${f.total} total</p></div></div>`).join('');

  const sel=document.getElementById(id);

function formatUsers(users){
  if(!users.length)return '—';
  const counts=new Map();
  for(const user of users)counts.set(user,(counts.get(user)||0)+1);
  return `<div class="user-list">${[...counts].map(([user,count])=>`<span class="user-chip">${esc(user)}${count>1?`<b>×${count}</b>`:''}</span>`).join('')}</div>`;
}
let sort='name',descending=false;
function render(){
  const query=document.querySelector('#search').value.trim().toLowerCase(),type=document.querySelector('#type').value;
  const visible=nodes.filter(n=>(!type||n.type===type)&&(!query||n.name.toLowerCase().includes(query)||n.users.some(u=>u.toLowerCase().includes(query))));
  visible.sort((a,b)=>{const av=sort==='users'?a.users.join(','):a[sort],bv=sort==='users'?b.users.join(','):b[sort];return (typeof av==='number'?av-bv:String(av).localeCompare(String(bv),undefined,{numeric:true}))*(descending?-1:1)});
  document.querySelector('#count').textContent=`Showing ${visible.length} of ${nodes.length} nodes`;
  document.querySelector('#nodes').innerHTML=visible.length?visible.map(n=>`<tr><td class="node">${esc(n.name)}</td><td>${esc(n.type)}</td><td class="num">${n.jobs}</td><td><span class="allocation-count">${n.allocated}/${n.capacity}</span><div class="allocation" title="${n.allocated} of ${n.capacity} GPUs allocated"><i style="width:${n.capacity?Math.min(100,100*n.allocated/n.capacity):0}%"></i></div></td><td><div class="slots" aria-label="${n.slots.filter(s=>s==='used').length} used, ${n.slots.filter(s=>s==='idle').length} idle">${n.slots.map(s=>`<span class="slot ${s}" title="${s}"></span>`).join('')}</div></td><td class="users" title="${esc(n.users.join(', '))}">${formatUsers(n.users)}</td></tr>`).join(''):`<tr><td colspan="6" class="empty">No matching nodes</td></tr>`;
